# Merge after compose.prod.yaml. Pilot only: no release promotion or public edge.
name: gym-platform-full-stack-pilot

x-web: &web
  init: true
  restart: unless-stopped
  mem_limit: 512m
  memswap_limit: 512m
  cpus: 1.0
  pids_limit: 128
  logging:
    driver: local
    options:
      max-size: '10m'
      max-file: '3'
  stop_grace_period: 30s
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

x-session-web: &session-web
  <<: *web
  environment:
    GYM_API_INTERNAL_URL: http://api:3000
  depends_on:
    api:
      condition: service_healthy

services:
  api:
    environment:
      ADMIN_APP_URL: ${ADMIN_APP_URL:?ADMIN_APP_URL must be set}
      TRAINER_APP_URL: ${TRAINER_APP_URL:?TRAINER_APP_URL must be set}

  landing:
    <<: *web
    image: gym-platform-landing:pilot
    build:
      context: ../..
      dockerfile: apps/landing/Dockerfile
    ports:
      - '127.0.0.1:${LANDING_PORT:-3002}:3000'

  web:
    <<: *session-web
    image: gym-platform-web:pilot
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'

  trainer:
    <<: *session-web
    image: gym-platform-trainer:pilot
    build:
      context: ../..
      dockerfile: apps/trainer/Dockerfile
    ports:
      - '127.0.0.1:${TRAINER_PORT:-3004}:3000'

  admin:
    <<: *session-web
    image: gym-platform-admin:pilot
    build:
      context: ../..
      dockerfile: apps/admin/Dockerfile
    ports:
      - '127.0.0.1:${ADMIN_PORT:-3003}:3000'
