# Dependabot does not merge anything; the repository owner reviews every PR.
# The npm entry discovers packages through pnpm-workspace.yaml and pnpm-lock.yaml.
# pnpm 12 currently emits a two-document lockfile: version PRs work, but
# dependency-graph alerts/security update PRs may be unavailable. Keep pnpm audit in CI.
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'wednesday'
      time: '08:00'
      timezone: 'Europe/Kyiv'
    open-pull-requests-limit: 10
    # Temporary toolchain compatibility guards. Revisit with Nest CLI,
    # Node runtime, or Expo SDK upgrades; keep reviewing security alerts.
    ignore:
      # TypeScript 7.0 removes the compiler API required by Nest CLI and
      # the API architecture import parser.
      - dependency-name: 'typescript'
        versions: ['>=7.0.0']
      # ESLint 10 breaks eslint-plugin-react (react/display-name) in Expo/Next
      # lint checks. Revisit when the ESLint ecosystem supports v10.
      - dependency-name: 'eslint'
        versions: ['>=10.0.0']
      # Keep Node type declarations aligned to our Node 24 runtime.
      - dependency-name: '@types/node'
        versions: ['>=25.0.0']
      # Expo SDK 58 recommends ~3.3.0 for this native dependency.
      # Remove after a reviewed Expo upgrade and native build verification.
      - dependency-name: 'react-native-gesture-handler'
        versions: ['>=3.4.0']
    # Group only dependencies that are reviewed and tested together.
    # Unmatched updates stay individual, including authentication, throttler,
    # mail, react-intl, React Native and native modules such as react-native-svg.
    # Major updates and runtime minor updates remain individual.
    groups:
      dev-tooling:
        applies-to: version-updates
        dependency-type: 'development'
        patterns:
          - 'turbo'
          - 'oxlint'
          - 'oxlint-tsgolint'
          - 'prettier'
          - 'knip'
          - 'lint-staged'
          - 'husky'
          - 'dependency-cruiser'
          - 'markdownlint-cli2'
          - 'mdast-util-from-markdown'
        update-types: ['minor', 'patch']
      testing:
        applies-to: version-updates
        dependency-type: 'development'
        patterns:
          - 'vitest'
          - '@vitest/*'
          - 'vitest-native'
          - '@playwright/test'
          - 'playwright'
          - 'playwright-core'
          - '@testing-library/*'
          - 'axe-core'
          - 'supertest'
        update-types: ['patch']
      nest-tooling:
        applies-to: version-updates
        patterns: ['@nestjs/cli', '@nestjs/schematics']
        update-types: ['patch']
      nest-core:
        applies-to: version-updates
        patterns:
          - '@nestjs/common'
          - '@nestjs/core'
          - '@nestjs/platform-express'
          - '@nestjs/testing'
        update-types: ['patch']
      prisma:
        applies-to: version-updates
        patterns: ['prisma', '@prisma/client', '@prisma/adapter-pg']
        update-types: ['patch']
      react-runtime:
        applies-to: version-updates
        patterns: ['react', 'react-dom']
        update-types: ['patch']
      expo-runtime:
        applies-to: version-updates
        patterns: ['expo', 'expo-*', '@expo/*']
        exclude-patterns: ['expo-doctor', 'expo-module-scripts']
        update-types: ['patch']
      next-framework:
        applies-to: version-updates
        patterns: ['next', 'eslint-config-next', '@next/*']
        update-types: ['patch']
      forms:
        applies-to: version-updates
        patterns: ['react-hook-form', '@hookform/resolvers']
        update-types: ['patch']
      web-ui:
        applies-to: version-updates
        patterns: ['tailwindcss', '@tailwindcss/*', 'tailwind-merge', 'clsx', 'lucide-react']
        update-types: ['patch']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'wednesday'
      time: '08:30'
      timezone: 'Europe/Kyiv'
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'docker'
    directory: '/apps/api'
    schedule:
      interval: 'weekly'
      day: 'wednesday'
      time: '09:00'
      timezone: 'Europe/Kyiv'
    open-pull-requests-limit: 3

  - package-ecosystem: 'docker-compose'
    directory: '/infra/docker'
    schedule:
      interval: 'weekly'
      day: 'wednesday'
      time: '09:30'
      timezone: 'Europe/Kyiv'
    open-pull-requests-limit: 3
