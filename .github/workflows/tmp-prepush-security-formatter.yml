name: Temporary pre-push security formatter

on:
  push:
    branches:
      - fix/windows-prepush-safe-argv-20261114

permissions:
  contents: read

jobs:
  format:
    name: Temporary Prettier formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Format and test security changes
        run: |
          set -euo pipefail
          pnpm exec prettier --write scripts/pre-push-checks.mjs scripts/pre-push-checks.test.mjs
          pnpm exec prettier --check scripts/pre-push-checks.mjs scripts/pre-push-checks.test.mjs docs/pre-push-checks.md .github/workflows/ci.yml
          node --test scripts/pre-push-checks.test.mjs
          for file in scripts/pre-push-checks.mjs scripts/pre-push-checks.test.mjs; do
            echo "FORMATTED_BEGIN:$file"
            base64 -w 0 "$file"
            echo
            echo "FORMATTED_END:$file"
          done
