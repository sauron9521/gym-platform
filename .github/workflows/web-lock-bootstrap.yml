name: Temporary web lockfile bootstrap

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-lock-bootstrap.yml'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Resolve pnpm lockfile
        run: CI=false pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Emit temporary encoded lockfile
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const encoded = fs.readFileSync('pnpm-lock.yaml').toString('base64');
          for (let i = 0; i < encoded.length; i += 4096) {
            console.log('LOCK_CHUNK:' + encoded.slice(i, i + 4096));
          }
          NODE
