name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Keep successful main-branch verification available after every merge.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:

  # Temporary, read-only helper to resolve the component-test lockfile in CI.
  # Removed before this PR is marked ready for merge.
  web-component-lockfile:
    name: Temporary lockfile generator
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Print generated lockfile
        run: |
          echo 'COMPONENT_LOCKFILE_BEGIN_168'
          cat pnpm-lock.yaml
          echo 'COMPONENT_LOCKFILE_END_168'
  changes:
    name: CI / Determine affected workspaces
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.select.outputs.full }}
      api: ${{ steps.select.outputs.api }}
      web: ${{ steps.select.outputs.web }}
      landing: ${{ steps.select.outputs.landing }}
      mobile: ${{ steps.select.outputs.mobile }}
      client: ${{ steps.select.outputs.client }}
      deps: ${{ steps.select.outputs.deps }}
      workspaces: ${{ steps.select.outputs.workspaces }}
      redis: ${{ steps.select.outputs.redis }}

    steps:
      - name: Checkout complete history for safe PR diff
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: select
        env:
          CI_FORCE_ALL: ${{ github.event_name != 'pull_request' }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-select.mjs --github-output "$GITHUB_OUTPUT"

  tooling-contracts:
    name: Tooling contracts / Vitest Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate root CI, security and operations contracts
        run: pnpm test:tooling

  prepush-windows:
    name: Pre-push / Windows Node 24
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Windows-safe pre-push argument handling
        run: pnpm exec vitest run --config vitest.config.mts scripts/pre-push-checks.test.mjs

  mobile-ios-dev-windows:
    name: Mobile iOS Dev / Windows Metro
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle iOS in Metro dev mode (HMR and pnpm link resolution)
        run: node apps/mobile/scripts/smoke-ios-dev.mjs

  web-browser-e2e:
    name: Web Browser E2E / Chromium
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GYM_API_INTERNAL_URL: http://127.0.0.1:3001

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # Catch compile/lint regressions before starting a browser or dev server.
      - name: Fast Web lint and typecheck gate
        run: |
          pnpm --filter @gym/web lint
          pnpm --filter @gym/web typecheck

      - name: Restore Playwright Chromium browser cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.65.0

      - name: Install Chromium and system dependencies
        run: pnpm --filter @gym/web exec playwright install --with-deps chromium

      - name: Browser tests against a loopback fixture HTTP API
        run: pnpm --filter @gym/web test:e2e
        env:
          CI: 'true'

      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-playwright-failures
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  landing-browser-e2e:
    name: Landing Browser E2E / Chromium
    needs: changes
    if: needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gym/landing exec playwright install --with-deps chromium
      - name: Browser checks against the real public Next.js app
        run: pnpm --filter @gym/landing test:e2e
        env:
          CI: 'true'
      - name: Upload traces if Landing smoke fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: landing-playwright-failures
          path: apps/landing/test-results/
          if-no-files-found: ignore
          retention-days: 7

  quality-workspaces:
    name: Quality workspaces / Node 24
    needs: changes
    if: needs.changes.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Build-time fixture only. Production deployment must supply the real API origin.
      GYM_API_INTERNAL_URL: http://127.0.0.1:3001
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Dependency downloads already use the pnpm store cache above.
      # Persist only build/tool caches, never node_modules, secrets or tests.
      - name: Restore Turborepo and Next.js incremental build caches
        uses: actions/cache@v6
        with:
          path: |
            .turbo/cache
            apps/web/.next/cache
            apps/landing/.next/cache
          key: ${{ runner.os }}-node24-build-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'apps/**/package.json', 'packages/**/package.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node24-build-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'apps/**/package.json', 'packages/**/package.json') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate local Docker Compose
        if: needs.changes.outputs.api == 'true'
        run: |
          docker compose --env-file infra/docker/.env.example -f infra/docker/compose.yaml config --quiet
          bash -n infra/docker/init/01-create-test-db.sh

      - name: Generate Prisma client
        if: needs.changes.outputs.api == 'true'
        run: pnpm --filter @gym/api db:generate

      - name: Validate Prisma schema
        if: needs.changes.outputs.api == 'true'
        run: pnpm --filter @gym/api db:validate

      - name: Verify Prisma initial baseline against schema
        if: needs.changes.outputs.api == 'true'
        run: pnpm --filter @gym/api db:baseline:check

      - name: Enforce feature architecture and runtime dependency graph
        if: needs.changes.outputs.api == 'true'
        run: |
          pnpm --filter @gym/api architecture:check
          pnpm --filter @gym/api architecture:deps
          pnpm --filter @gym/api test:architecture
          pnpm --filter @gym/api test:coverage-tools

      - name: Check formatting
        run: pnpm format:check

      # Only Redis-related pull requests exercise the extra Docker image upgrade.
      - name: Rehearse isolated Redis 7 to Redis 8 AOF and backup recovery
        if: github.event_name == 'pull_request' && needs.changes.outputs.redis == 'true'
        run: bash scripts/test-redis-upgrade.sh

      - name: Full workspace regression for main and cross-cutting changes
        if: needs.changes.outputs.full == 'true'
        run: |
          pnpm lint
          pnpm typecheck
          # API unit tests with coverage are enforced by the protected E2E gate.
          pnpm exec turbo run test --filter=@gym/web --filter=@gym/mobile --filter=@gym/api-client
          pnpm build

      - name: Lint, typecheck, test and build affected workspaces
        if: needs.changes.outputs.full != 'true' && needs.changes.outputs.workspaces == 'true'
        env:
          CI_API: ${{ needs.changes.outputs.api }}
          CI_WEB: ${{ needs.changes.outputs.web }}
          CI_LANDING: ${{ needs.changes.outputs.landing }}
          CI_MOBILE: ${{ needs.changes.outputs.mobile }}
          CI_CLIENT: ${{ needs.changes.outputs.client }}
        run: |
          set -euo pipefail
          filters=()
          if [ "$CI_API" = true ]; then filters+=(--filter=@gym/api); fi
          if [ "$CI_WEB" = true ]; then filters+=(--filter=@gym/web); fi
          # Include the UI package typecheck when its Web consumer is selected.
          if [ "$CI_WEB" = true ]; then filters+=(--filter=@gym/ui-web); fi
          if [ "$CI_LANDING" = true ]; then filters+=(--filter=@gym/landing); fi
          if [ "$CI_MOBILE" = true ]; then filters+=(--filter=@gym/mobile); fi
          if [ "$CI_CLIENT" = true ]; then filters+=(--filter=@gym/api-client); fi
          test "${#filters[@]}" -gt 0
          pnpm exec turbo run lint "${filters[@]}"
          pnpm exec turbo run typecheck "${filters[@]}"
          # API unit tests run in the dedicated coverage job.
          test_filters=()
          if [ "$CI_WEB" = true ]; then test_filters+=(--filter=@gym/web); fi
          if [ "$CI_MOBILE" = true ]; then test_filters+=(--filter=@gym/mobile); fi
          if [ "$CI_CLIENT" = true ]; then test_filters+=(--filter=@gym/api-client); fi
          if [ "${#test_filters[@]}" -gt 0 ]; then
            pnpm exec turbo run test "${test_filters[@]}"
          fi
          pnpm exec turbo run build "${filters[@]}"

  quality:
    name: Quality / Node 24
    needs:
      - changes
      - quality-workspaces
      - tooling-contracts
      - prepush-windows
      - web-browser-e2e
      - dependency-security
      - mobile-ios-dev-windows
      - landing-browser-e2e
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Fail closed if change classification, tooling, Windows, browser or dependency audit fails
        env:
          QUALITY_WORKSPACES_RESULT: ${{ needs.quality-workspaces.result }}
          TOOLING_CONTRACTS_RESULT: ${{ needs.tooling-contracts.result }}
          CHANGE_DETECTION_RESULT: ${{ needs.changes.result }}
          FULL_SCOPE: ${{ needs.changes.outputs.full }}
          WEB_REQUIRED: ${{ needs.changes.outputs.web }}
          DEPS_REQUIRED: ${{ needs.changes.outputs.deps }}
          WINDOWS_RESULT: ${{ needs.prepush-windows.result }}
          WEB_E2E_RESULT: ${{ needs.web-browser-e2e.result }}
          SECURITY_RESULT: ${{ needs.dependency-security.result }}
          MOBILE_REQUIRED: ${{ needs.changes.outputs.mobile }}
          LANDING_REQUIRED: ${{ needs.changes.outputs.landing }}
          LANDING_E2E_RESULT: ${{ needs.landing-browser-e2e.result }}
          MOBILE_IOS_DEV_RESULT: ${{ needs.mobile-ios-dev-windows.result }}
        run: |
          set -euo pipefail
          test "$CHANGE_DETECTION_RESULT" = success
          test "$QUALITY_WORKSPACES_RESULT" = success
          test "$TOOLING_CONTRACTS_RESULT" = success
          if [ "$FULL_SCOPE" = true ]; then
            test "$WINDOWS_RESULT" = success
          else
            test "$FULL_SCOPE" = false
            test "$WINDOWS_RESULT" = skipped
          fi
          if [ "$WEB_REQUIRED" = true ]; then
            test "$WEB_E2E_RESULT" = success
          else
            test "$WEB_REQUIRED" = false
            test "$WEB_E2E_RESULT" = skipped
          fi
          if [ "$DEPS_REQUIRED" = true ]; then
            test "$SECURITY_RESULT" = success
          else
            test "$DEPS_REQUIRED" = false
            test "$SECURITY_RESULT" = skipped
          fi
          if [ "$LANDING_REQUIRED" = true ]; then
            test "$LANDING_E2E_RESULT" = success
          else
            test "$LANDING_REQUIRED" = false
            test "$LANDING_E2E_RESULT" = skipped
          fi
          if [ "$MOBILE_REQUIRED" = true ]; then
            test "$MOBILE_IOS_DEV_RESULT" = success
          else
            test "$MOBILE_REQUIRED" = false
            test "$MOBILE_IOS_DEV_RESULT" = skipped
          fi

  api-coverage:
    name: API Coverage / Critical modules
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @gym/api db:generate

      - name: Enforce existing Vitest coverage thresholds
        run: pnpm --filter @gym/api test:cov

      - name: Summarize measured coverage by critical module
        if: always()
        run: |
          if [ -s apps/api/coverage/coverage-summary.json ]; then
            pnpm --filter @gym/api coverage:summary
          else
            echo "Coverage summary unavailable; inspect Vitest logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Inventory production sources absent from unit coverage
        if: always()
        run: |
          if [ -s apps/api/coverage/coverage-summary.json ]; then
            pnpm --filter @gym/api coverage:inventory
          else
            echo "Coverage inventory unavailable; inspect Vitest logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload API coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-coverage-report
          path: apps/api/coverage/
          if-no-files-found: ignore

  dependency-security:
    name: Dependency vulnerability audit
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      # Audits read the lockfile and fetch registry advisory data; no install.
      # Avoid fetching the pnpm package store into this job.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Block high and critical production vulnerabilities
        run: pnpm audit --prod --audit-level high

      - name: Block critical vulnerabilities across all workspaces
        run: pnpm audit --audit-level critical

  api-operations:
    name: API Operations / Backup and monitoring
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate backup and restore scripts without external services
        run: |
          bash -n scripts/backup-production.sh scripts/test-backup-production.sh scripts/test-backup-readiness.sh scripts/verify-backup-freshness.sh
          sh -n scripts/restore-drill.sh
          bash scripts/test-backup-production.sh
          bash scripts/test-backup-readiness.sh

      - name: Verify immutable GHCR Compose override and offline operator digest guards
        env:
          DEPLOY_RUNTIME_IMAGE: ghcr.io/sauron9521/gym-platform@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          DEPLOY_MIGRATE_IMAGE: ghcr.io/sauron9521/gym-platform-migrate@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          SOURCE_SHA: cccccccccccccccccccccccccccccccccccccccc
          PUBLISH_SHA: dddddddddddddddddddddddddddddddddddddddd
          EXPECTED_CURRENT_IMAGE: none
          DATABASE_URL: postgresql://example:example@db.invalid:5432/gym_test?schema=public
          JWT_SECRET: ci-local-not-a-secret
          JWT_ISSUER: https://issuer.example.invalid
          APP_URL: https://app.example.invalid
          CORS_ORIGINS: https://app.example.invalid
          SMTP_URL: smtp://mail.example.invalid:2525
          MAIL_FROM: test@example.invalid
        run: |
          node scripts/production-digest-guard.mjs refs
          docker compose --env-file infra/docker/.env.example \
            -f infra/docker/compose.prod.yaml \
            -f infra/docker/compose.digest.prod.yaml \
            --profile ops config --format json \
            | node scripts/production-digest-guard.mjs compose

      - name: Validate operator-only host preflight and private backup contracts offline
        run: |
          bash -n scripts/production-host-preflight.sh

      - name: Check opt-in systemd service and timer units
        run: |
          systemd-analyze verify \
            ops/backup/gym-platform-api-backup.service \
            ops/backup/gym-platform-api-backup.timer \
            ops/backup/gym-platform-api-backup-health.service \
            ops/backup/gym-platform-api-backup-health.timer
          systemd-analyze calendar '*-*-* 03:30:00'
          systemd-analyze calendar '*:0/15'

      - name: Validate backup Prometheus alert rules and firing scenarios
        run: |
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/ops/monitoring:/rules:ro" \
            prom/prometheus@sha256:23031bfe0e74a13004252caaa74eccd0d62b6c6e7a04711d5b8bf5b7e113adc7 \
            check rules /rules/backup-health.rules.yml
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/ops/monitoring:/rules:ro" \
            prom/prometheus@sha256:23031bfe0e74a13004252caaa74eccd0d62b6c6e7a04711d5b8bf5b7e113adc7 \
            test rules /rules/backup-health.test.yml

  api-staging-contracts:
    name: API Staging / Signed GHCR offline contracts
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate staging operator shell syntax (unit contracts in required tooling job)
        run: |
          bash -n scripts/staging-upgrade-run.sh

  api-readiness:
    name: API Readiness / Verified release NO-GO
    needs: [changes, tooling-contracts]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Enforce passed signed release and operator NO-GO contracts
        env:
          TOOLING_CONTRACTS_RESULT: ${{ needs.tooling-contracts.result }}
        run: test "$TOOLING_CONTRACTS_RESULT" = success

  api-migration:
    name: API Migration / Source inventory and cutover NO-GO
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify imported source and immutable Prisma history
        run: |
          pnpm --filter @gym/api exec vitest run --config vitest.config.tools.ts test/migration-baseline.test.mjs

      - name: Publish read-only migration inventory and missing-gates report
        run: node scripts/api-migration-readiness.mjs --report >> "$GITHUB_STEP_SUMMARY"

  api-observability:
    name: API Observability / HTTP, Redis and Docker
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate shell runners and monitor privilege boundaries
        run: |
          bash -n scripts/monitoring-collect.sh scripts/monitoring-forward.sh

      - name: Validate opt-in monitoring systemd units and timer syntax
        run: |
          systemd-analyze verify \
            ops/monitoring/gym-platform-api-forwarder.service \
            ops/monitoring/gym-platform-api-forwarder.timer \
            ops/monitoring/gym-platform-api-monitor.service \
            ops/monitoring/gym-platform-api-monitor.timer \
            ops/monitoring/gym-platform-api-resources.service \
            ops/monitoring/gym-platform-api-resources.timer \
            ops/monitoring/gym-platform-api-signals.service \
            ops/monitoring/gym-platform-api-signals.timer
          systemd-analyze calendar '*:0/1'
          systemd-analyze calendar '*:0/5'

      - name: Validate alerts and provisional observed SLO simulations
        run: |
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/ops/monitoring:/rules:ro" \
            prom/prometheus@sha256:23031bfe0e74a13004252caaa74eccd0d62b6c6e7a04711d5b8bf5b7e113adc7 \
            check rules /rules/alerts.rules.yml /rules/slo.rules.yml
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/ops/monitoring:/rules:ro" \
            prom/prometheus@sha256:23031bfe0e74a13004252caaa74eccd0d62b6c6e7a04711d5b8bf5b7e113adc7 \
            test rules /rules/alerts.test.yml /rules/slo.test.yml

  api-docker:
    name: API Docker / Node 24
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify production Docker policy
        run: pnpm --filter @gym/api exec vitest run --config vitest.config.tools.ts test/production-docker.test.mjs

      - name: Validate production Compose (dummy values, no deployment)
        env:
          DATABASE_URL: postgresql://example:example@db.example.test:5432/gym_app
          JWT_SECRET: placeholder-not-for-production-deployment-tests-only
          JWT_ISSUER: https://api.example.test
          APP_URL: https://app.example.test
          CORS_ORIGINS: https://app.example.test
          SMTP_URL: smtps://example:example@mail.example.test:465
          MAIL_FROM: Gym Test <noreply@example.test>
        run: docker compose -f infra/docker/compose.prod.yaml config --quiet

      - name: Build production runtime image (no deployment)
        run: docker build -f apps/api/Dockerfile --target runtime -t gym-platform-api:runtime-ci .

      - name: Build one-shot migration image (no migration execution)
        run: docker build -f apps/api/Dockerfile --target migrate -t gym-platform-api:migrate-ci .

      - name: Check image contents and non-root runtime
        run: |
          docker run --rm --entrypoint sh gym-platform-api:runtime-ci -ec '
            test -f dist/main.js
            test -f dist/mail/templates/password-reset.html
            test ! -x node_modules/.bin/prisma
            test "$(id -u)" -ne 0
            node --version
          '
          docker run --rm --entrypoint sh gym-platform-api:migrate-ci -ec '
            test -x ../../node_modules/.bin/prisma
            test -d prisma/migrations
            test "$(id -u)" -ne 0
          '

  api-e2e-suite:
    name: API e2e suite / PostgreSQL 17
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Independent runners provide separate PostgreSQL test databases.
    # Both shards must pass before the stable API e2e gate succeeds.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gym_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gym_app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gym_app_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gym_app_test?schema=public
      TEST_REDIS_URL: redis://127.0.0.1:6379
      CORS_ORIGINS: http://localhost:3000
      APP_URL: http://localhost:3000
      JWT_ISSUER: http://localhost:3000
      JWT_SECRET: xjYwwAdHREaWbPRsTFQikrf0jnu4enSyEfthz+evnJo
      MAIL_FROM: Gym Test <no-reply@example.test>

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Guard disposable test database
        working-directory: apps/api
        run: |
          node --input-type=module <<'NODE'
          const db = process.env.DATABASE_URL;
          const testDb = process.env.TEST_DATABASE_URL;
          if (!db || !testDb || db !== testDb) {
            throw new Error('Database URLs must be identical and dedicated to tests.');
          }
          const url = new URL(db);
          const name = decodeURIComponent(url.pathname.slice(1));
          if (!name.toLowerCase().endsWith('_test') ||
              !['127.0.0.1', 'localhost'].includes(url.hostname)) {
            throw new Error('Refusing to migrate a non-local or non-test database.');
          }
          console.log('Disposable test database guard passed:', name);
          NODE

      - name: Generate Prisma Client
        run: pnpm --filter @gym/api db:generate

      - name: Typecheck integration and HTTP e2e tests
        run: pnpm --filter @gym/api typecheck:e2e

      - name: Apply test database migrations
        run: pnpm --filter @gym/api db:migrate:deploy

      - name: Seed test exercise library
        run: pnpm --filter @gym/api db:seed

      # Build NestJS with decorator metadata; fail if generated client types drift.
      - name: Verify generated OpenAPI contract is committed and current
        if: matrix.shard == 1
        run: pnpm api:contract:check

      - name: Integration and HTTP e2e tests (shard ${{ matrix.shard }}/2)
        run: pnpm --filter @gym/api exec vitest run --config ./vitest.config.e2e.ts --shard=${{ matrix.shard }}/2

      - name: Rehearse isolated PostgreSQL 17 and avatar restore (disposable CI only)
        if: matrix.shard == 1
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/gym-platform-api-restore-drill"
          mkdir -p "$work/backup" "$work/avatars"
          volume="gym-platform-ci-avatar-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'docker volume rm -f "$volume" >/dev/null 2>&1 || true; rm -rf -- "$work"' EXIT
          printf 'sample-avatar\n' > "$work/avatars/sample.png"

          # PostgreSQL 17 client matches the server major version.
          docker run --rm --network host \
            --mount "type=bind,src=$work/backup,dst=/backup" \
            -e BACKUP_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/gym_app_test \
            postgres:17-alpine sh -ec \
            'pg_dump --format=custom --no-owner --no-acl --dbname="$BACKUP_DATABASE_URL" --file=/backup/postgres.dump'

          tar -czf "$work/backup/avatars.tar.gz" -C "$work/avatars" .
          (
            cd "$work/backup"
            sha256sum postgres.dump avatars.tar.gz > SHA256SUMS
            printf 'created_utc=%s\navatar_volume=disposable-ci\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > MANIFEST.txt
          )

          # Provision a NEW isolated target, never restore to gym_app_test.
          docker run --rm --network host -e PGPASSWORD=postgres \
            postgres:17-alpine psql -h 127.0.0.1 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -c 'CREATE DATABASE gym_restore_test'

          docker run --rm --network host \
            --mount "type=bind,src=$work/backup,dst=/backup,readonly" \
            --mount "type=bind,src=$PWD/scripts,dst=/scripts,readonly" \
            -e DATABASE_URL \
            -e RESTORE_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/gym_restore_test \
            -e RESTORE_DRILL_CONFIRM=I_ACKNOWLEDGE_ISOLATED_RESTORE \
            postgres:17-alpine sh /scripts/restore-drill.sh /backup

          # Restore sample avatar into a disposable scratch Docker volume.
          docker volume create "$volume" >/dev/null
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --mount "type=volume,src=$volume,dst=/avatars" \
            --mount "type=bind,src=$work/backup,dst=/backup,readonly" \
            alpine:3.21 tar -xzf /backup/avatars.tar.gz -C /avatars
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --mount "type=volume,src=$volume,dst=/avatars,readonly" \
            alpine:3.21 test -s /avatars/sample.png

  api-e2e:
    # Keep the existing required check while skipping unnecessary DB jobs.
    name: API e2e / PostgreSQL 17
    needs: [changes, api-e2e-suite, api-coverage]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Enforce conditional API E2E result
        env:
          CHANGE_DETECTION_RESULT: ${{ needs.changes.result }}
          API_REQUIRED: ${{ needs.changes.outputs.api }}
          SUITE_RESULT: ${{ needs.api-e2e-suite.result }}
          COVERAGE_RESULT: ${{ needs.api-coverage.result }}
        run: |
          set -euo pipefail
          test "$CHANGE_DETECTION_RESULT" = success
          if [ "$API_REQUIRED" = true ]; then
            test "$SUITE_RESULT" = success
            test "$COVERAGE_RESULT" = success
          else
            test "$API_REQUIRED" = false
            test "$SUITE_RESULT" = skipped
            test "$COVERAGE_RESULT" = skipped
          fi
