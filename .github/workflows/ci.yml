name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Keep successful main-branch verification available after every merge.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: Quality / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate local Docker Compose
        run: |
          docker compose --env-file infra/docker/.env.example -f infra/docker/compose.yaml config --quiet
          bash -n infra/docker/init/01-create-test-db.sh

      - name: Generate Prisma client
        run: pnpm --filter @gym/api db:generate

      - name: Validate Prisma schema
        run: pnpm --filter @gym/api db:validate

      - name: Enforce feature architecture and runtime dependency graph
        run: |
          pnpm --filter @gym/api architecture:check
          pnpm --filter @gym/api architecture:deps
          pnpm --filter @gym/api test:architecture
          pnpm --filter @gym/api test:coverage-tools

      - name: Validate release and GHCR safety contracts (offline)
        run: node --test scripts/release-bundle.test.mjs scripts/ghcr-promotion.test.mjs scripts/release-supply-chain.test.mjs scripts/release-ci-gate.test.mjs

      - name: Check formatting
        run: pnpm format:check

      - name: Lint workspaces
        run: pnpm lint

      - name: Typecheck workspaces
        run: pnpm typecheck

      - name: Test workspaces
        run: pnpm test

      - name: Build workspaces
        run: pnpm build

  api-coverage:
    name: API Coverage / Critical modules
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @gym/api db:generate

      - name: Enforce existing Vitest coverage thresholds
        run: pnpm --filter @gym/api test:cov

      - name: Summarize measured coverage by critical module
        if: always()
        run: |
          if [ -s apps/api/coverage/coverage-summary.json ]; then
            pnpm --filter @gym/api coverage:summary
          else
            echo "Coverage summary unavailable; inspect Vitest logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Inventory production sources absent from unit coverage
        if: always()
        run: |
          if [ -s apps/api/coverage/coverage-summary.json ]; then
            pnpm --filter @gym/api coverage:inventory
          else
            echo "Coverage inventory unavailable; inspect Vitest logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload API coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-coverage-report
          path: apps/api/coverage/
          if-no-files-found: ignore

  dependency-security:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Block high and critical production vulnerabilities
        run: pnpm audit --prod --audit-level high

      - name: Block critical vulnerabilities across all workspaces
        run: pnpm audit --audit-level critical

  api-operations:
    name: API Operations / Backup and monitoring
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate backup and restore scripts without external services
        run: |
          bash -n scripts/backup-production.sh scripts/test-backup-production.sh scripts/test-backup-readiness.sh scripts/verify-backup-freshness.sh
          sh -n scripts/restore-drill.sh
          bash scripts/test-backup-production.sh
          bash scripts/test-backup-readiness.sh
          node --test scripts/monitoring-backup-health.test.mjs scripts/backup-operations.test.mjs

      - name: Check opt-in systemd service and timer units
        run: |
          systemd-analyze verify \
            ops/backup/gym-platform-api-backup.service \
            ops/backup/gym-platform-api-backup.timer \
            ops/backup/gym-platform-api-backup-health.service \
            ops/backup/gym-platform-api-backup-health.timer
          systemd-analyze calendar '*-*-* 03:30:00'
          systemd-analyze calendar '*:0/15'

      - name: Validate backup Prometheus alert rules and firing scenarios
        run: |
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/ops/monitoring:/rules:ro" \
            prom/prometheus@sha256:23031bfe0e74a13004252caaa74eccd0d62b6c6e7a04711d5b8bf5b7e113adc7 \
            check rules /rules/backup-health.rules.yml
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/ops/monitoring:/rules:ro" \
            prom/prometheus@sha256:23031bfe0e74a13004252caaa74eccd0d62b6c6e7a04711d5b8bf5b7e113adc7 \
            test rules /rules/backup-health.test.yml

  api-docker:
    name: API Docker / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify production Docker policy
        run: node --test apps/api/test/production-docker.test.mjs

      - name: Validate production Compose (dummy values, no deployment)
        env:
          DATABASE_URL: postgresql://example:example@db.example.test:5432/gym_app
          JWT_SECRET: placeholder-not-for-production-deployment-tests-only
          JWT_ISSUER: https://api.example.test
          APP_URL: https://app.example.test
          CORS_ORIGINS: https://app.example.test
          SMTP_URL: smtps://example:example@mail.example.test:465
          MAIL_FROM: Gym Test <noreply@example.test>
        run: docker compose -f infra/docker/compose.prod.yaml config --quiet

      - name: Build production runtime image (no deployment)
        run: docker build -f apps/api/Dockerfile --target runtime -t gym-platform-api:runtime-ci .

      - name: Build one-shot migration image (no migration execution)
        run: docker build -f apps/api/Dockerfile --target migrate -t gym-platform-api:migrate-ci .

      - name: Check image contents and non-root runtime
        run: |
          docker run --rm --entrypoint sh gym-platform-api:runtime-ci -ec '
            test -f dist/main.js
            test -f dist/mail/templates/password-reset.html
            test ! -x node_modules/.bin/prisma
            test "$(id -u)" -ne 0
            node --version
          '
          docker run --rm --entrypoint sh gym-platform-api:migrate-ci -ec '
            test -x ./node_modules/.bin/prisma
            test -d prisma/migrations
            test "$(id -u)" -ne 0
          '

  api-e2e:
    name: API e2e / PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gym_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gym_app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gym_app_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gym_app_test?schema=public
      TEST_REDIS_URL: redis://127.0.0.1:6379
      CORS_ORIGINS: http://localhost:3000
      APP_URL: http://localhost:3000
      JWT_ISSUER: http://localhost:3000
      JWT_SECRET: xjYwwAdHREaWbPRsTFQikrf0jnu4enSyEfthz+evnJo
      MAIL_FROM: Gym Test <no-reply@example.test>

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Guard disposable test database
        working-directory: apps/api
        run: |
          node --input-type=module <<'NODE'
          const db = process.env.DATABASE_URL;
          const testDb = process.env.TEST_DATABASE_URL;
          if (!db || !testDb || db !== testDb) {
            throw new Error('Database URLs must be identical and dedicated to tests.');
          }
          const url = new URL(db);
          const name = decodeURIComponent(url.pathname.slice(1));
          if (!name.toLowerCase().endsWith('_test') ||
              !['127.0.0.1', 'localhost'].includes(url.hostname)) {
            throw new Error('Refusing to migrate a non-local or non-test database.');
          }
          console.log('Disposable test database guard passed:', name);
          NODE

      - name: Generate Prisma Client
        run: pnpm --filter @gym/api db:generate

      - name: Typecheck integration and HTTP e2e tests
        run: pnpm --filter @gym/api typecheck:e2e

      - name: Apply test database migrations
        run: pnpm --filter @gym/api db:migrate:deploy

      - name: Seed test exercise library
        run: pnpm --filter @gym/api db:seed

      # Build NestJS with decorator metadata; fail if generated client types drift.
      - name: Verify generated OpenAPI contract is committed and current
        run: pnpm api:contract:check

      - name: Integration and HTTP e2e tests
        run: pnpm --filter @gym/api test:e2e

      - name: Rehearse isolated PostgreSQL 17 and avatar restore (disposable CI only)
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/gym-platform-api-restore-drill"
          mkdir -p "$work/backup" "$work/avatars"
          volume="gym-platform-ci-avatar-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'docker volume rm -f "$volume" >/dev/null 2>&1 || true; rm -rf -- "$work"' EXIT
          printf 'sample-avatar\n' > "$work/avatars/sample.png"

          # PostgreSQL 17 client matches the server major version.
          docker run --rm --network host \
            --mount "type=bind,src=$work/backup,dst=/backup" \
            -e BACKUP_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/gym_app_test \
            postgres:17-alpine sh -ec \
            'pg_dump --format=custom --no-owner --no-acl --dbname="$BACKUP_DATABASE_URL" --file=/backup/postgres.dump'

          tar -czf "$work/backup/avatars.tar.gz" -C "$work/avatars" .
          (
            cd "$work/backup"
            sha256sum postgres.dump avatars.tar.gz > SHA256SUMS
            printf 'created_utc=%s\navatar_volume=disposable-ci\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > MANIFEST.txt
          )

          # Provision a NEW isolated target, never restore to gym_app_test.
          docker run --rm --network host -e PGPASSWORD=postgres \
            postgres:17-alpine psql -h 127.0.0.1 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -c 'CREATE DATABASE gym_restore_test'

          docker run --rm --network host \
            --mount "type=bind,src=$work/backup,dst=/backup,readonly" \
            --mount "type=bind,src=$PWD/scripts,dst=/scripts,readonly" \
            -e DATABASE_URL \
            -e RESTORE_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/gym_restore_test \
            -e RESTORE_DRILL_CONFIRM=I_ACKNOWLEDGE_ISOLATED_RESTORE \
            postgres:17-alpine sh /scripts/restore-drill.sh /backup

          # Restore sample avatar into a disposable scratch Docker volume.
          docker volume create "$volume" >/dev/null
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --mount "type=volume,src=$volume,dst=/avatars" \
            --mount "type=bind,src=$work/backup,dst=/backup,readonly" \
            alpine:3.21 tar -xzf /backup/avatars.tar.gz -C /avatars
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --mount "type=volume,src=$volume,dst=/avatars,readonly" \
            alpine:3.21 test -s /avatars/sample.png
