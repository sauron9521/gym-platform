name: Tooling / Knip, Turborepo, and dependency-cruiser (manual)

# Explicit on-demand diagnostics; never a required PR gate or deployment.
on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: 'Optional full base commit SHA on main; supply both SHAs'
        required: false
        type: string
      head_sha:
        description: 'Optional full head commit SHA on main; supply both SHAs'
        required: false
        type: string

permissions:
  contents: read

jobs:
  audit:
    name: Tooling / Dependency hygiene, boundaries, and Turbo dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate optional main-history comparison range
        id: comparison-range
        env:
          AUDIT_BASE_SHA: ${{ inputs.base_sha }}
          AUDIT_HEAD_SHA: ${{ inputs.head_sha }}
        run: node scripts/ci-turbo-affected-shadow.mjs --resolve-range --github-output "$GITHUB_OUTPUT"
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate local Prisma Client for static imports
        run: pnpm --filter @gym/api db:generate
      - name: Report Knip findings without blocking on existing lint issues
        run: |
          set -euo pipefail
          pnpm knip:report 2>&1 | tee "$RUNNER_TEMP/knip.txt"
      - name: Check workspace imports and resolved rules using one graph
        run: |
          set -euo pipefail
          pnpm architecture:cruise:boundaries 2>&1 | tee "$RUNNER_TEMP/architecture-workspace-imports.txt"
      - name: Preview Turborepo graph without running tasks
        run: |
          set -euo pipefail
          pnpm exec turbo run lint typecheck build --dry=json > "$RUNNER_TEMP/turbo-plan.json"
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';

          const plan = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/turbo-plan.json', 'utf8'));
          const tasks = plan.tasks ?? [];
          const counts = new Map();
          for (const item of tasks) counts.set(item.task, (counts.get(item.task) ?? 0) + 1);
          const lines = [
            '### Advisory Knip / dependency-cruiser / Turborepo baseline',
            '',
            'Knip findings are diagnostic and are **not** automatically removed.',
            'Resolved dependency-cruiser rule details are emitted by the native err-long formatter from the same graph.',
            'The combined named/relative workspace import graph gate is required in CI.',
            'Turborepo was run with `--dry=json`; **no lint, test or build tasks executed**.',
            '',
            'Total planned Turbo tasks: ' + tasks.length,
            ...[...counts].map(([name, count]) => '- ' + name + ': ' + count),
          ];
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          console.log(lines.join('\n'));
          NODE
      - name: Compare validated main commit range with Turborepo affected (advisory)
        env:
          TURBO_SCM_BASE: ${{ steps.comparison-range.outputs.base }}
          TURBO_SCM_HEAD: ${{ steps.comparison-range.outputs.head }}
          AUDIT_SELECTION_MODE: ${{ steps.comparison-range.outputs.mode }}
        run: |
          set -euo pipefail
          pnpm exec turbo run lint typecheck build --affected --dry=json \
            > "$RUNNER_TEMP/turbo-affected-plan.json"
          node scripts/ci-turbo-affected-shadow.mjs \
            --base "$TURBO_SCM_BASE" --head "$TURBO_SCM_HEAD" \
            --plan "$RUNNER_TEMP/turbo-affected-plan.json" \
            --output "$RUNNER_TEMP/turbo-affected-comparison.json"
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';

          const report = JSON.parse(
            readFileSync(process.env.RUNNER_TEMP + '/turbo-affected-comparison.json', 'utf8'),
          );
          const lines = [
            '### Advisory Turbo affected vs ci-select (' + process.env.AUDIT_SELECTION_MODE + ')',
            '',
            'This comparison does not change PR routing or release gates.',
            'Commit range: \`' + report.base.slice(0, 12) + '...'
              + report.head.slice(0, 12) + '\`',
            'Changed paths: ' + report.changedPaths.length,
            'Selected application/client packages: ' + report.requiredPackages.length,
            'Turbo task packages: ' + report.turboPackages.length,
            'Potential missing packages in Turbo: '
              + (report.missingFromTurbo.join(', ') || '(none)'),
            'Extra application/client packages in Turbo: '
              + (report.extraAppPackages.join(', ') || '(none)'),
            '',
            'Review the JSON artifact before considering any CI routing migration.',
          ];
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          NODE
      - name: Upload bounded diagnostic artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tooling-audit-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/knip.txt
            ${{ runner.temp }}/architecture-workspace-imports.txt
            ${{ runner.temp }}/turbo-plan.json
            ${{ runner.temp }}/turbo-affected-plan.json
            ${{ runner.temp }}/turbo-affected-comparison.json
          if-no-files-found: error
          retention-days: 7
