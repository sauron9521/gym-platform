name: Tooling / Knip, Turborepo, and dependency-cruiser (manual)

# Explicit on-demand diagnostics; never a required PR gate or deployment.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Tooling / Dependency hygiene, boundaries, and Turbo dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate local Prisma Client for static imports
        run: pnpm --filter @gym/api db:generate
      - name: Report Knip findings without blocking on existing lint issues
        run: |
          set -euo pipefail
          pnpm knip:report 2>&1 | tee "$RUNNER_TEMP/knip.txt"
      - name: Check dependency-cruiser source boundaries (manual diagnostic)
        run: |
          set -euo pipefail
          pnpm architecture:cruise 2>&1 | tee "$RUNNER_TEMP/architecture-cruise.txt"
      - name: Check named application imports from dependency-cruiser graph
        run: |
          set -euo pipefail
          pnpm architecture:cruise:named 2>&1 | tee "$RUNNER_TEMP/architecture-named-imports.txt"
      - name: Compare relative workspace imports from dependency-cruiser graph
        run: |
          set -euo pipefail
          pnpm architecture:cruise:relative 2>&1 | tee "$RUNNER_TEMP/architecture-relative-imports.txt"
      - name: Preview Turborepo graph without running tasks
        run: |
          set -euo pipefail
          pnpm exec turbo run lint typecheck build --dry=json > "$RUNNER_TEMP/turbo-plan.json"
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';

          const plan = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/turbo-plan.json', 'utf8'));
          const tasks = plan.tasks ?? [];
          const counts = new Map();
          for (const item of tasks) counts.set(item.task, (counts.get(item.task) ?? 0) + 1);
          const lines = [
            '### Advisory Knip / dependency-cruiser / Turborepo baseline',
            '',
            'Knip findings are diagnostic and are **not** automatically removed.',
            'Resolved dependency-cruiser source rules and relative-import parity are manual.',
            'Exact named app imports remain enforced by the required Tooling contracts gate.',
            'Turborepo was run with `--dry=json`; **no lint, test or build tasks executed**.',
            '',
            'Total planned Turbo tasks: ' + tasks.length,
            ...[...counts].map(([name, count]) => '- ' + name + ': ' + count),
          ];
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          console.log(lines.join('\n'));
          NODE
      - name: Upload bounded diagnostic artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tooling-audit-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/knip.txt
            ${{ runner.temp }}/architecture-cruise.txt
            ${{ runner.temp }}/architecture-named-imports.txt
            ${{ runner.temp }}/architecture-relative-imports.txt
            ${{ runner.temp }}/turbo-plan.json
          if-no-files-found: error
          retention-days: 7
