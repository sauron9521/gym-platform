name: I18N temporary review checks
on:
  push:
    branches:
      - feat/i18n-15-web-training-programs
      - feat/i18n-17b-mobile-program-list
      - feat/i18n-20-landing-localized-seo
      - feat/i18n-21-localized-transactional-mail
      - feat/i18n-23-catalog-translation-schema
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      GYM_API_INTERNAL_URL: http://127.0.0.1:3001
      DATABASE_URL: postgresql://example:example@db.invalid:5432/gym_test?schema=public
      JWT_SECRET: ci-local-test-secret-at-least-32-characters-long
      JWT_ISSUER: https://issuer.example.invalid
      APP_URL: https://app.example.invalid
      CORS_ORIGINS: https://app.example.invalid
      SMTP_URL: smtp://mail.example.invalid:2525
      MAIL_FROM: test@example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: '12.18.0'
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - name: Format new locale modules
        run: |
          pnpm exec prettier --write packages/i18n
          case "$GITHUB_REF_NAME" in
            feat/i18n-15-web-training-programs) pnpm exec prettier --write apps/web/src apps/web/test/components/sign-in-form.test.tsx ;;
            feat/i18n-17b-mobile-program-list) pnpm exec prettier --write apps/mobile/src apps/mobile/test/vitest/workouts-screen.test.tsx apps/mobile/test/vitest/programs-screen.test.tsx ;;
            feat/i18n-20-landing-localized-seo) pnpm exec prettier --write apps/landing/src apps/landing/test/i18n-seo-contract.test.mjs ;;
            feat/i18n-21-localized-transactional-mail) pnpm exec prettier --write apps/api/src/modules/auth/mailers apps/api/src/modules/auth/test/auth-mailers.spec.ts apps/api/src/modules/users/repositories/users.repository.ts ;;
            feat/i18n-23-catalog-translation-schema) pnpm exec prettier --write apps/api/prisma/schemas/exercises.prisma || true ;;
          esac
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/i18n apps/web apps/mobile apps/landing apps/api
          if ! git diff --cached --quiet; then
            git commit -m 'style(i18n): format stacked localization files'
            HUSKY=0 git push
          fi
      - run: pnpm format:check
      - name: Verify affected app
        run: |
          case "$GITHUB_REF_NAME" in
            feat/i18n-15-web-training-programs) APP=web ;;
            feat/i18n-17b-mobile-program-list) APP=mobile ;;
            feat/i18n-20-landing-localized-seo) APP=landing ;;
            feat/i18n-21-localized-transactional-mail|feat/i18n-23-catalog-translation-schema) APP=api ;;
          esac
          if [ "$APP" = api ]; then pnpm --filter @gym/api db:generate && pnpm --filter @gym/api db:validate; fi
          pnpm --filter "@gym/$APP" typecheck
          pnpm --filter "@gym/$APP" test
          pnpm --filter @gym/i18n check
