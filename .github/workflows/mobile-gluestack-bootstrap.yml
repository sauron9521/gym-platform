name: Mobile UI bootstrap (temporary)

on:
  push:
    branches:
      - feat/mobile-gluestack-v5-foundation

permissions:
  contents: write

jobs:
  scaffold:
    if: ${{ !contains(github.event.head_commit.message, '[gluestack bootstrap]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install existing workspace
        run: pnpm install --frozen-lockfile
      - name: Generate gluestack-ui v5 and UniWind for Expo
        working-directory: apps/mobile
        run: |
          pnpm dlx gluestack-ui@latest init --uniwind --use-pnpm --path src/shared/ui/gluestack -y
          pnpm dlx gluestack-ui@latest add button --use-pnpm -y
          pnpm dlx gluestack-ui@latest add box --use-pnpm -y
          pnpm dlx gluestack-ui@latest add text --use-pnpm -y
      - name: Repair Expo Router root layout (gluestack CLI does not handle Stack.Protected)
        run: |
          cat > apps/mobile/src/app/_layout.tsx <<'EOF'
          import '../../global.css';

          import { Stack } from 'expo-router';
          import { StatusBar } from 'expo-status-bar';
          import { GestureHandlerRootView } from 'react-native-gesture-handler';

          import { AuthProvider, useAuth } from '@/features/auth/model/auth-context';
          import { GluestackUIProvider } from '@/shared/ui/gluestack/gluestack-ui-provider';

          function Navigation() {
            const { account } = useAuth();
            return (
              <>
                <Stack screenOptions={{ headerShown: false }}>
                  <Stack.Protected guard={Boolean(account)}>
                    <Stack.Screen name="(tabs)" />
                  </Stack.Protected>
                  <Stack.Protected guard={!account}>
                    <Stack.Screen name="sign-in" />
                  </Stack.Protected>
                </Stack>
                <StatusBar style="auto" />
              </>
            );
          }

          export default function RootLayout() {
            return (
              <GestureHandlerRootView style={{ flex: 1 }}>
                <GluestackUIProvider mode="light">
                  <AuthProvider>
                    <Navigation />
                  </AuthProvider>
                </GluestackUIProvider>
              </GestureHandlerRootView>
            );
          }
          EOF
      - name: Update pnpm lock and format generated UI
        run: |
          pnpm install --lockfile-only
          pnpm exec prettier --write apps/mobile/src/app/_layout.tsx apps/mobile/src/shared/ui/gluestack apps/mobile/global.css apps/mobile/metro.config.js apps/mobile/package.json apps/mobile/tsconfig.json apps/mobile/uniwind-types.d.ts apps/mobile/babel.config.js
      - name: Commit generated files on feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            HUSKY=0 git commit -m "chore(mobile): [gluestack bootstrap] scaffold v5 UI and pnpm lockfile"
            HUSKY=0 git push origin HEAD:feat/mobile-gluestack-v5-foundation
          fi
