name: Temporary auth client formatting

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/api-client/**'
      - '.github/workflows/auth-client-format.yml'

permissions:
  contents: read

jobs:
  format:
    name: Format and verify auth adapters
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - name: Apply Prettier
        run: pnpm exec prettier --write packages/api-client/src/auth.ts packages/api-client/test/auth-client.test.mjs packages/api-client/test/contract-types.test.ts
      - name: Shared client typecheck
        run: pnpm --filter @gym/api-client typecheck
      - name: Shared client tests
        run: pnpm --filter @gym/api-client test
      - name: Frontend consumers typecheck
        run: |
          pnpm --filter @gym/web typecheck
          pnpm --filter @gym/mobile typecheck
      - name: Emit formatted files
        if: always()
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const paths=[
            'packages/api-client/src/auth.ts',
            'packages/api-client/test/auth-client.test.mjs',
            'packages/api-client/test/contract-types.test.ts',
          ];
          for(const [i,path] of paths.entries()){
            const encoded=fs.readFileSync(path).toString('base64');
            console.log('AUTH_FORMAT_ENTRY:'+i+':'+path+':'+encoded.length);
            for(let j=0;j<encoded.length;j+=4096){
              console.log('AUTH_FORMAT_CHUNK:'+i+':'+encoded.slice(j,j+4096));
            }
          }
          NODE
