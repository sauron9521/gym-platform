name: Temporary OpenAPI contract bootstrap

on:
  pull_request:
    branches:
      - main
    paths:
      - 'packages/api-client/**'
      - 'apps/api/package.json'
      - 'apps/web/**'
      - 'apps/mobile/**'
      - '.github/workflows/openapi-bootstrap.yml'

permissions:
  contents: read

jobs:
  generate:
    name: Bootstrap OpenAPI snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gym_app_test?schema=public
      JWT_SECRET: xjYwwAdHREaWbPRsTFQikrf0jnu4enSyEfthz+evnJo
      JWT_ISSUER: http://localhost:3001
      APP_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      MAIL_FROM: Gym Test <no-reply@example.test>
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gym_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gym_app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Refresh pnpm lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm --filter @gym/api db:generate
      - name: Generate OpenAPI and API client types
        run: pnpm api:contract:generate
      - name: Verify shared package and consumers
        run: |
          pnpm --filter @gym/api-client typecheck
          pnpm --filter @gym/api-client test
          pnpm --filter @gym/web typecheck
          pnpm --filter @gym/mobile typecheck
      - name: Emit generated artifacts
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const files = [
            'pnpm-lock.yaml',
            'apps/api/openapi/openapi.json',
            'packages/api-client/src/generated/schema.d.ts',
          ];
          for (const [index, file] of files.entries()) {
            if (!fs.existsSync(file)) continue;
            const data = fs.readFileSync(file).toString('base64');
            console.log('CONTRACT_ARTIFACT:' + index + ':' + file + ':' + data.length);
            for (let n = 0; n < data.length; n += 4096) {
              console.log('CONTRACT_CHUNK:' + index + ':' + data.slice(n, n + 4096));
            }
          }
          NODE
