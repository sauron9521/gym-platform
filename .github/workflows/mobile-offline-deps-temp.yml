name: Mobile Offline dependencies bootstrap (temporary)
on:
  push:
    branches:
      - feat/mobile-offline-connectivity-foundation
permissions:
  contents: write
jobs:
  bootstrap:
    if: ${{ !contains(github.event.head_commit.message, '[offline bootstrap]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Add Expo SDK 58 compatible device network and haptics modules
        run: pnpm --filter @gym/mobile add 'expo-network@~58.0.5' 'expo-haptics@~58.0.8'
      - name: Commit exact dependency lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/package.json pnpm-lock.yaml
          HUSKY=0 git commit -m 'chore(mobile): [offline bootstrap] install SDK58 network and haptics'
          HUSKY=0 git push origin HEAD:feat/mobile-offline-connectivity-foundation
