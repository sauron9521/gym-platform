name: Temporary Web E2E lock and formatter

on:
  push:
    branches:
      - test/web-playwright-browser-e2e-20261114

permissions:
  contents: write

jobs:
  prepare:
    name: Temporary Web E2E lockfile and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Resolve and install pinned Playwright
        run: pnpm install --no-frozen-lockfile
      - name: Apply project formatting
        run: |
          pnpm exec prettier --write apps/web/package.json apps/web/playwright.config.ts apps/web/e2e/support/mock-api.mjs apps/web/e2e/specs/auth-workouts.spec.ts apps/web/README.md
          pnpm exec prettier --check apps/web/package.json apps/web/playwright.config.ts apps/web/e2e/support/mock-api.mjs apps/web/e2e/specs/auth-workouts.spec.ts apps/web/README.md
      - name: Commit locked dependency graph and formatted tests to feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml apps/web/package.json apps/web/playwright.config.ts apps/web/e2e/support/mock-api.mjs apps/web/e2e/specs/auth-workouts.spec.ts apps/web/README.md
          if ! git diff --cached --quiet; then
            git commit -m "build(web): lock Playwright 1.65.1 and format browser E2E"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
