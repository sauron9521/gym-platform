name: Temporary Web E2E lock and formatter

on:
  push:
    branches:
      - test/web-playwright-browser-e2e-20261114

permissions:
  contents: read

jobs:
  prepare:
    name: Temporary Web E2E lockfile and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Resolve and install pinned Playwright
        run: pnpm install --no-frozen-lockfile
      - name: Apply project formatting
        run: |
          set -euo pipefail
          pnpm exec prettier --write apps/web/package.json apps/web/playwright.config.ts apps/web/e2e/support/mock-api.mjs apps/web/e2e/specs/auth-workouts.spec.ts apps/web/README.md .github/workflows/ci.yml
          pnpm exec prettier --check apps/web/package.json apps/web/playwright.config.ts apps/web/e2e/support/mock-api.mjs apps/web/e2e/specs/auth-workouts.spec.ts apps/web/README.md .github/workflows/ci.yml
      - name: Emit formatted files and lockfile for PR commit
        run: |
          set -euo pipefail
          for file in pnpm-lock.yaml apps/web/package.json apps/web/playwright.config.ts apps/web/e2e/support/mock-api.mjs apps/web/e2e/specs/auth-workouts.spec.ts apps/web/README.md .github/workflows/ci.yml; do
            echo "FORMATTED_BEGIN:$file"
            base64 -w 0 "$file"
            echo
            echo "FORMATTED_END:$file"
          done
