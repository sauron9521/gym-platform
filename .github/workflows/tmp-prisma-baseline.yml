name: Temporary Prisma baseline generator

on:
  push:
    branches:
      - chore/prisma-generated-baseline-20261114

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generate schema-only SQL with Prisma CLI v7
        run: |
          set -euo pipefail
          cd apps/api
          pnpm exec prisma migrate diff \
            --from-empty \
            --to-schema prisma/schemas \
            --config prisma7.config.ts \
            --script \
            -o "$RUNNER_TEMP/prisma-generated.sql"
          wc -c "$RUNNER_TEMP/prisma-generated.sql"
          sha256sum "$RUNNER_TEMP/prisma-generated.sql"
          echo PRISMA_BASE64_BEGIN
          base64 -w 0 "$RUNNER_TEMP/prisma-generated.sql"
          echo
          echo PRISMA_BASE64_END
