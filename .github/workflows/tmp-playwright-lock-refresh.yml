name: Temporary Playwright lockfile refresh

on:
  push:
    branches:
      - test/web-playwright-browser-e2e-20261114

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh Playwright lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --no-frozen-lockfile
      - name: Verify frozen supply-chain install
        run: pnpm install --frozen-lockfile
      - name: Commit Playwright 1.65.0 lockfile to feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "build(web): use vetted Playwright 1.65.0 lockfile"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
