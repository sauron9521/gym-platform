name: Temporary auth OpenAPI codegen

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/src/modules/auth/**'
      - 'apps/api/src/infra/openapi/**'
      - '.github/workflows/auth-openapi-bootstrap.yml'

permissions:
  contents: read

jobs:
  generate:
    name: Generate auth contract snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gym_app_test?schema=public
      JWT_SECRET: xjYwwAdHREaWbPRsTFQikrf0jnu4enSyEfthz+evnJo
      JWT_ISSUER: http://localhost:3001
      APP_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      MAIL_FROM: Gym Test <no-reply@example.test>
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gym_app_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d gym_app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gym/api db:generate
      - run: pnpm api:contract:generate
      - run: pnpm --filter @gym/api typecheck
      - name: Emit generated files
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const paths = ['apps/api/openapi/openapi.json', 'packages/api-client/src/generated/schema.d.ts'];
          for (const [index,path] of paths.entries()) {
            const encoded=fs.readFileSync(path).toString('base64');
            console.log('AUTH_DOC_ENTRY:'+index+':'+path+':'+encoded.length);
            for(let n=0;n<encoded.length;n+=4096) console.log('AUTH_DOC_CHUNK:'+index+':'+encoded.slice(n,n+4096));
          }
          NODE
