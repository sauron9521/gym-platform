name: Temporary dev format verification

on:
  pull_request:
    branches:
      - main
    paths:
      - 'infra/docker/**'
      - '.github/workflows/local-dev-format.yml'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Reformat Docker files
        run: pnpm exec prettier --write infra/docker/compose.yaml infra/docker/README.md
      - name: Validate Docker Compose and init script
        run: |
          docker compose --env-file infra/docker/.env.example -f infra/docker/compose.yaml config --quiet
          bash -n infra/docker/init/01-create-test-db.sh
      - name: Emit formatted files
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const files=['infra/docker/compose.yaml','infra/docker/README.md'];
          files.forEach((file,index)=>{
            const encoded=fs.readFileSync(file).toString('base64');
            for(let i=0;i<encoded.length;i+=4096){
              console.log('LOCAL_FORMAT_'+index+':'+encoded.slice(i,i+4096));
            }
          });
          NODE
