name: Temporary client formatting

on:
  pull_request:
    branches: [main]
    paths:
      - 'README.md'
      - 'packages/api-client/**'
      - '.github/workflows/client-format.yml'

permissions:
  contents: read

jobs:
  format:
    name: Format client documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - name: Format client documentation and TS config
        run: pnpm exec prettier --write README.md packages/api-client/README.md packages/api-client/tsconfig.json
      - name: Emit formatted files
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const paths=['README.md','packages/api-client/README.md','packages/api-client/tsconfig.json'];
          for(const [i,path] of paths.entries()){
            const value=fs.readFileSync(path).toString('base64');
            console.log('FORMAT_ENTRY:'+i+':'+path+':'+value.length);
            for(let j=0;j<value.length;j+=4096)console.log('FORMAT_DATA:'+i+':'+value.slice(j,j+4096));
          }
          NODE
