name: Temporary web formatting bootstrap

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-format-bootstrap.yml'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Reformat web files
        run: |
          pnpm exec prettier --write apps/web/src/app/globals.css apps/web/src/widgets/home/ui/home-screen.tsx apps/web/tsconfig.json
          node - <<'NODE'
          const fs = require('node:fs');
          const files = [
            'apps/web/src/app/globals.css',
            'apps/web/src/widgets/home/ui/home-screen.tsx',
            'apps/web/tsconfig.json',
          ];
          files.forEach((file, index) => {
            console.log('FORMATTED_' + index + ':' + fs.readFileSync(file).toString('base64'));
          });
          NODE
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build
