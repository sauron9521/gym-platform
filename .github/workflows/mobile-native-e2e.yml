name: Mobile native E2E / Maestro (manual)

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Direct Expo EAS artifact URL (https://expo.dev/artifacts/eas/*.apk)'
        required: true
        type: string
      apk_sha256:
        description: 'SHA-256 of APK independently downloaded from your own EAS build'
        required: true
        type: string
      app_id:
        description: 'Android application ID from the trusted APK manifest'
        required: true
        type: string
      flow:
        description: 'Staging smoke suite'
        required: true
        default: auth
        type: choice
        options:
          - auth
          - workouts
          - session-restore
          - workout-write
          - reconcile-resume
          - reconcile-offline-android
          - reconcile-lost-response
          - draft-resume
          - draft-lost-response
          - draft-account-isolation
          - calendar-read
      draft_fault_title:
        description: 'Only draft-lost-response: unique pre-armed Mobile-draft-fault-<suffix> title'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-native-staging-smoke
  cancel-in-progress: false

jobs:
  native-smoke:
    name: Maestro / Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: mobile-staging
    env:
      APP_ID: ${{ inputs.app_id }}
      APK_URL: ${{ inputs.apk_url }}
      APK_SHA256: ${{ inputs.apk_sha256 }}
      FLOW: ${{ inputs.flow }}
      DRAFT_FAULT_TITLE: ${{ inputs.draft_fault_title }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Refuse unreviewed branch dispatch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo 'Native staging smoke requires reviewed main.' >&2
            exit 1
          fi

      - name: Set up Node.js for input validation
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: Reject non-EAS APK sources and malformed inputs
        run: node scripts/validate-mobile-smoke-inputs.mjs

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Maestro CLI
        shell: bash
        env:
          MAESTRO_VERSION: '2.12.1'
        run: |
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' \
            https://get.maestro.mobile.dev --output "$RUNNER_TEMP/maestro-install.sh"
          bash "$RUNNER_TEMP/maestro-install.sh"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run authenticated staging smoke on a verified APK
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          E2E_EMAIL: ${{ secrets.MOBILE_E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.MOBILE_E2E_PASSWORD }}
          E2E_EXERCISE_NAME: ${{ secrets.MOBILE_E2E_EXERCISE_NAME }}
          STAGING_CALENDAR_WORKOUT_TITLE: ${{ secrets.MOBILE_E2E_CALENDAR_WORKOUT_TITLE }}
          STAGING_RECONCILE_WORKOUT_TITLE: ${{ secrets.MOBILE_E2E_RECONCILE_WORKOUT_TITLE }}
          E2E_SECOND_EMAIL: ${{ secrets.MOBILE_E2E_SECOND_EMAIL }}
          E2E_SECOND_PASSWORD: ${{ secrets.MOBILE_E2E_SECOND_PASSWORD }}
          EXPECTED_STAGING_APP_ID: ${{ secrets.MOBILE_STAGING_ANDROID_APP_ID }}
        with:
          api-level: 34
          arch: x86_64
          script: |
            set -euo pipefail
            if [[ -z "$E2E_EMAIL" || -z "$E2E_PASSWORD" ]]; then
              echo "The mobile-staging environment needs disposable test account secrets." >&2
              exit 1
            fi
            if [[ "$FLOW" == "workout-write" ]]; then
              if [[ -z "$E2E_EXERCISE_NAME" || -z "$EXPECTED_STAGING_APP_ID" ]]; then
                echo "Workout write smoke needs staging exercise seed and staging Android application ID." >&2
                exit 1
              fi
              if [[ "$APP_ID" != "$EXPECTED_STAGING_APP_ID" ]]; then
                echo "Workout write smoke refused: APK package is not the approved staging package." >&2
                exit 1
              fi
            fi
            if [[ "$FLOW" == reconcile-* ]]; then
              if [[ -z "$STAGING_RECONCILE_WORKOUT_TITLE" || -z "$EXPECTED_STAGING_APP_ID" ]]; then
                echo "Reconciliation flows require an approved seeded staging workout and Android app ID." >&2
                exit 1
              fi
              if [[ "$APP_ID" != "$EXPECTED_STAGING_APP_ID" ]]; then
                echo "Reconciliation flow refused: APK is not the approved staging package." >&2
                exit 1
              fi
            fi
            if [[ "$FLOW" == draft-* ]]; then
              if [[ -z "$E2E_EXERCISE_NAME" || -z "$EXPECTED_STAGING_APP_ID" || "$APP_ID" != "$EXPECTED_STAGING_APP_ID" ]]; then
                echo "Draft flows require an approved staging package and seeded exercise." >&2
                exit 1
              fi
              if [[ "$FLOW" == "draft-lost-response" && ! "$DRAFT_FAULT_TITLE" =~ ^Mobile-draft-fault-[A-Za-z0-9-]{8,64}$ ]]; then
                echo "Lost-response draft flow requires a unique pre-armed fault title." >&2
                exit 1
              fi
              if [[ "$FLOW" == "draft-account-isolation" ]]; then
                if [[ -z "$E2E_SECOND_EMAIL" || -z "$E2E_SECOND_PASSWORD" || "${E2E_EMAIL,,}" == "${E2E_SECOND_EMAIL,,}" ]]; then
                  echo "Draft isolation requires two distinct disposable staging athletes." >&2
                  exit 1
                fi
              fi
            fi
            if [[ "$FLOW" == "calendar-read" ]]; then
              if [[ -z "$STAGING_CALENDAR_WORKOUT_TITLE" || -z "$EXPECTED_STAGING_APP_ID" || "$APP_ID" != "$EXPECTED_STAGING_APP_ID" ]]; then
                echo "Calendar flow requires an approved staging package and today's seeded workout." >&2
                exit 1
              fi
            fi
            curl --fail --location --silent --show-error --max-time 240 \
              --proto '=https' --proto-redir '=https' \
              --max-filesize 250000000 \
              "$APK_URL" --output /tmp/gym-platform-preview.apk
            printf '%s  %s\n' "${APK_SHA256,,}" /tmp/gym-platform-preview.apk | sha256sum --check --status
            AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
            if [[ -z "$AAPT" ]]; then
              echo "Android SDK aapt is required to validate the APK manifest." >&2
              exit 1
            fi
            INSTALLED_ID="$("$AAPT" dump badging /tmp/gym-platform-preview.apk |
              sed -n "s/^package: name='\([^']*\)'.*/\1/p" |
              head -n 1)"
            if [[ "$INSTALLED_ID" != "$APP_ID" ]]; then
              echo "APK application ID does not match the selected staging package." >&2
              exit 1
            fi
            adb install -r /tmp/gym-platform-preview.apk
            case "$FLOW" in
              auth) FLOW_FILE=auth-smoke.yaml ;;
              workouts) FLOW_FILE=workouts-smoke.yaml ;;
              session-restore) FLOW_FILE=session-restore-smoke.yaml ;;
              workout-write) FLOW_FILE=workout-write-smoke.yaml ;;
              reconcile-resume) FLOW_FILE=workout-reconcile-resume.yaml ;;
              reconcile-offline-android) FLOW_FILE=workout-reconcile-offline-android.yaml ;;
              reconcile-lost-response) FLOW_FILE=workout-reconcile-lost-response.yaml ;;
              draft-resume) FLOW_FILE=workout-draft-resume.yaml ;;
              draft-lost-response) FLOW_FILE=workout-draft-lost-response.yaml ;;
              draft-account-isolation) FLOW_FILE=workout-draft-account-isolation.yaml ;;
              calendar-read) FLOW_FILE=workout-calendar-smoke.yaml ;;
              *) echo "Unsupported Maestro flow" >&2; exit 1 ;;
            esac
            WORKOUT_TITLE="Mobile-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            if [[ "$FLOW" == reconcile-* ]]; then
              WORKOUT_TITLE="$STAGING_RECONCILE_WORKOUT_TITLE"
            elif [[ "$FLOW" == "draft-lost-response" ]]; then
              WORKOUT_TITLE="$DRAFT_FAULT_TITLE"
            elif [[ "$FLOW" == "calendar-read" ]]; then
              WORKOUT_TITLE="$STAGING_CALENDAR_WORKOUT_TITLE"
            fi
            # Pass the second account only for the isolation flow.
            SECOND_ACCOUNT_ARGS=()
            if [[ "$FLOW" == "draft-account-isolation" ]]; then
              SECOND_ACCOUNT_ARGS=(-e E2E_SECOND_EMAIL="$E2E_SECOND_EMAIL" -e E2E_SECOND_PASSWORD="$E2E_SECOND_PASSWORD")
            fi
            maestro test "${SECOND_ACCOUNT_ARGS[@]}" -e APP_ID="$APP_ID" -e E2E_EMAIL="$E2E_EMAIL" \
              -e E2E_PASSWORD="$E2E_PASSWORD" \
              -e E2E_EXERCISE_NAME="$E2E_EXERCISE_NAME" \
              -e E2E_WORKOUT_TITLE="$WORKOUT_TITLE" \
              "apps/mobile/maestro/flows/$FLOW_FILE"
