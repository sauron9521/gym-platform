name: Live staging health smoke (manual)

on:
  workflow_dispatch:
    inputs:
      staging_api_url:
        description: 'Explicit HTTPS staging API origin (not production)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: live-staging-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Live staging / health (NO-GO)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Probe live staging liveness and readiness without credentials
        env:
          STAGING_API_URL: ${{ inputs.staging_api_url }}
        run: node scripts/staging-live-smoke.mjs
      - name: Record limited evidence only
        run: |
          echo 'Live staging health endpoints returned HTTP 200 and {status:ok}.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This smoke does not grant production deployment approval.' >> "$GITHUB_STEP_SUMMARY"
