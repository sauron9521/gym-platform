name: Temporary pre-push source formatter

on:
  push:
    branches:
      - ci/scope-pre-push-checks-20261114

permissions:
  contents: read

jobs:
  format:
    name: Temporary pre-push formatter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Format changed sources and validate scoped Prettier CLI
        run: |
          set -euo pipefail
          pnpm exec prettier --write scripts/pre-push-checks.mjs scripts/pre-push-checks.test.mjs
          pnpm exec prettier --check --ignore-unknown -- docs/pre-push-checks.md
          node --test scripts/pre-push-checks.test.mjs
          for file in scripts/pre-push-checks.mjs scripts/pre-push-checks.test.mjs; do
            echo "FORMATTED_BEGIN:$file"
            base64 -w 0 "$file"
            echo
            echo "FORMATTED_END:$file"
          done
