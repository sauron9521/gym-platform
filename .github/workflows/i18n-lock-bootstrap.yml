# Temporary bootstrap for the pnpm lockfile on the i18n dependency branch.
name: i18n lockfile bootstrap
on:
  push:
    branches:
      - chore/i18n-04-runtime-dependencies
permissions:
  contents: write
jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        with:
          version: '12.18.0'
          run_install: false
      - run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Commit generated lockfile if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m 'chore(i18n): regenerate pnpm lockfile for localization runtimes'
            git push
          fi
