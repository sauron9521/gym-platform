name: Web integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  browser-api:
    name: Web / Real API and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gym_browser_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d gym_browser_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gym_browser_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gym_browser_test
      APP_URL: http://127.0.0.1:3200
      CORS_ORIGINS: http://127.0.0.1:3200
      JWT_ISSUER: http://127.0.0.1:3200
      JWT_SECRET: browser-integration-test-only-secret-123456
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Guard disposable database before migrations
        run: |
          node --input-type=module -e '
            const value = process.env.TEST_DATABASE_URL;
            if (!value || value !== process.env.DATABASE_URL) throw new Error("Test database URLs must match");
            const url = new URL(value);
            if (url.hostname !== "127.0.0.1" || !decodeURIComponent(url.pathname).endsWith("_test")) throw new Error("Disposable loopback database required");
          '
      - run: pnpm --filter @gym/api db:generate
      - run: pnpm --filter @gym/api db:migrate:deploy
      - run: pnpm --filter @gym/api build
      - run: pnpm --filter @gym/web exec playwright install --with-deps chromium
      - run: pnpm --filter @gym/web test:e2e:integration
      - name: Retain failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: real-api-browser-failures
          path: apps/web/test-results/integration/
          if-no-files-found: ignore
          retention-days: 7
