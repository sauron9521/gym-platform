name: Web integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: Web integration / Determine affected workspaces
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.select.outputs.full == 'true' || steps.select.outputs.api == 'true' || steps.select.outputs.web == 'true' || steps.select.outputs.client == 'true' }}
    steps:
      - name: Checkout complete history for safe PR diff
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Test change classification and required-gate contract
        run: node --test scripts/ci-select.test.mjs
      - name: Classify changed files
        id: select
        env:
          CI_FORCE_ALL: ${{ github.event_name != 'pull_request' }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-select.mjs --github-output "$GITHUB_OUTPUT"

  browser-api-suite:
    name: Web / Real API and PostgreSQL suite (${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Each matrix job runs on its own VM with a disposable PostgreSQL container.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gym_browser_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d gym_browser_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WEB_E2E_SHARD_INDEX: ${{ matrix.shard }}
      WEB_E2E_SHARD_COUNT: '4'
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gym_browser_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gym_browser_test
      APP_URL: http://127.0.0.1:3200
      CORS_ORIGINS: http://127.0.0.1:3200
      JWT_ISSUER: http://127.0.0.1:3200
      JWT_SECRET: browser-integration-test-only-secret-123456
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify all specs are assigned to exactly one CI shard
        run: node --test apps/web/test/real-api-e2e-shards.test.mjs
      - name: Guard disposable database before migrations
        run: |
          node --input-type=module -e '
            const value = process.env.TEST_DATABASE_URL;
            if (!value || value !== process.env.DATABASE_URL) throw new Error("Test database URLs must match");
            const url = new URL(value);
            if (url.hostname !== "127.0.0.1" || !decodeURIComponent(url.pathname).endsWith("_test")) throw new Error("Disposable loopback database required");
          '
      - run: pnpm --filter @gym/api db:generate
      - run: pnpm --filter @gym/api db:migrate:deploy
      # The browser creates workouts from the actual seeded public exercise catalogue.
      - run: pnpm --filter @gym/api db:seed
      - run: pnpm --filter @gym/api build
      - name: Restore Playwright Chromium browser cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.65.0
      - run: pnpm --filter @gym/web exec playwright install --with-deps chromium
      - run: pnpm --filter @gym/web test:e2e:integration
      - name: Retain failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: real-api-browser-failures-${{ matrix.shard }}
          path: apps/web/test-results/integration/
          if-no-files-found: ignore
          retention-days: 7

  browser-api:
    # Keep the existing required check name stable, even when the suite is skipped.
    name: Web / Real API and PostgreSQL
    needs: [changes, browser-api-suite]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce affected browser suite result (fail closed)
        env:
          CLASSIFY_RESULT: ${{ needs.changes.result }}
          RUN_REQUIRED: ${{ needs.changes.outputs.run }}
          SUITE_RESULT: ${{ needs.browser-api-suite.result }}
        run: |
          set -euo pipefail
          test "$CLASSIFY_RESULT" = success
          if [ "$RUN_REQUIRED" = true ]; then
            test "$SUITE_RESULT" = success
          else
            test "$RUN_REQUIRED" = false
            test "$SUITE_RESULT" = skipped
          fi
