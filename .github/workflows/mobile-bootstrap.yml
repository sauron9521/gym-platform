name: Temporary mobile formatting extraction

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-bootstrap.yml'

permissions:
  contents: read

jobs:
  format-and-emit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Format mobile config and home screen
        run: |
          pnpm exec prettier --write apps/mobile/app.json apps/mobile/src/screens/home/ui/home-screen.tsx
          node - <<'NODE'
          const fs = require('node:fs');
          const paths = ['apps/mobile/app.json','apps/mobile/src/screens/home/ui/home-screen.tsx'];
          for (const [i,p] of paths.entries()) {
            console.log('FORMATTED_MOBILE_' + i + ':' + fs.readFileSync(p).toString('base64'));
          }
          NODE
