name: Temporary mobile lockfile and formatting

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-bootstrap.yml'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Resolve secure lockfile
        run: |
          pnpm clean --lockfile
          pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Reformat mobile source
        run: pnpm exec prettier --write 'apps/mobile/**/*.{json,js,ts,tsx,md}'
      - name: Verify mobile
        run: |
          pnpm --filter @gym/mobile lint
          pnpm --filter @gym/mobile typecheck
          pnpm --filter @gym/mobile test
          pnpm --filter @gym/mobile build
      - name: Emit formatted files and lock
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const files = ['pnpm-lock.yaml','apps/mobile/package.json','apps/mobile/app.json','apps/mobile/src/screens/home/ui/home-screen.tsx'];
          for (const [idx,path] of files.entries()) {
            const b64 = fs.readFileSync(path).toString('base64');
            for (let j=0;j<b64.length;j+=4096) console.log('EXTRACT_MOBILE_' + idx + ':' + b64.slice(j,j+4096));
          }
          NODE
