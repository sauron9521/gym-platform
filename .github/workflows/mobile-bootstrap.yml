name: Temporary mobile bootstrap

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-bootstrap.yml'

permissions:
  contents: read

jobs:
  prepare-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies without frozen lock
        run: CI=false pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Align Expo dependencies with SDK
        run: CI=false pnpm --filter @gym/mobile exec expo install --fix --pnpm
      - name: Format new files
        run: pnpm exec prettier --write 'apps/mobile/**/*.{json,js,ts,tsx,md}'
      - name: Validate Expo project
        run: |
          pnpm --filter @gym/mobile lint
          pnpm --filter @gym/mobile typecheck
          pnpm --filter @gym/mobile test
          pnpm --filter @gym/mobile build
      - name: Emit package manifest and lockfile
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const files = ['pnpm-lock.yaml', 'apps/mobile/package.json'];
          for (const [index, file] of files.entries()) {
            const encoded = fs.readFileSync(file).toString('base64');
            for (let i = 0; i < encoded.length; i += 4096) {
              console.log('BOOT_FILE_' + index + ':' + encoded.slice(i, i + 4096));
            }
          }
          NODE
