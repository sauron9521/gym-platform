# Temporary verification/contract regeneration for I18N-03. Delete after run.
name: i18n API contract bootstrap
on:
  push:
    branches:
      - feat/i18n-03-user-locale-preference
permissions:
  contents: write
jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://example:example@db.invalid:5432/gym_test?schema=public
      JWT_SECRET: ci-local-long-secret-at-least-32-characters-not-for-use
      JWT_ISSUER: https://issuer.example.invalid
      APP_URL: https://app.example.invalid
      CORS_ORIGINS: https://app.example.invalid
      SMTP_URL: smtp://mail.example.invalid:2525
      MAIL_FROM: test@example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: '12.18.0'
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gym/api db:generate
      - run: pnpm --filter @gym/api db:validate
      - run: pnpm api:contract:generate
      - run: |
          pnpm exec prettier --write \
            apps/api/src/modules/users/controllers/users.controller.ts \
            apps/api/src/modules/users/services/users.service.ts \
            apps/api/src/modules/users/repositories/users.repository.ts \
            apps/api/src/modules/users/selects/user.select.ts \
            apps/api/src/modules/users/dto/update-my-preferences.dto.ts \
            apps/api/src/modules/users/test/update-my-preferences.dto.spec.ts \
            apps/api/src/modules/users/test/users.service.spec.ts \
            apps/api/src/modules/users/test/controllers/users.controller.spec.ts
      - name: Commit generated API contracts and formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/openapi/openapi.json packages/api-client/src/generated/schema.d.ts apps/api/src/modules/users
          if ! git diff --cached --quiet; then
            git commit -m 'chore(i18n): regenerate API contracts for locale preference'
            HUSKY=0 git push
          fi
      - run: pnpm --filter @gym/api typecheck
      - run: pnpm --filter @gym/api test
