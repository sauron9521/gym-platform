name: Temporary auth OpenAPI formatting

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/test/openapi-contracts.e2e-spec.ts'
      - 'packages/api-client/test/contract-types.test.ts'
      - '.github/workflows/auth-openapi-format.yml'

permissions:
  contents: read

jobs:
  format:
    name: Format auth contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/api/test/openapi-contracts.e2e-spec.ts packages/api-client/test/contract-types.test.ts
      - name: Emit formatted tests
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const files=['apps/api/test/openapi-contracts.e2e-spec.ts','packages/api-client/test/contract-types.test.ts'];
          files.forEach((file,index)=>{
            const encoded=fs.readFileSync(file).toString('base64');
            console.log('FMT_AUTH_ENTRY:'+index+':'+file+':'+encoded.length);
            for(let j=0;j<encoded.length;j+=4096)
              console.log('FMT_AUTH_CHUNK:'+index+':'+encoded.slice(j,j+4096));
          });
          NODE
