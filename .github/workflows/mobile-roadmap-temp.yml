name: Mobile Roadmap PR Format and Check (temporary)
on:
  push:
    branches:
      - feat/mobile-workout-set-logging
permissions:
  contents: write
concurrency:
  group: roadmap-format-all
  cancel-in-progress: false
jobs:
  mobile-branches:
    if: ${{ !contains(github.event.head_commit.message, '[roadmap format]') }}
    name: Format and typecheck ${{ matrix.branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        branch:
          - test/mobile-eas-maestro-native
          - feat/mobile-offline-connectivity-foundation
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install exact workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Format mobile files and print formatted native workflow for maintenance
        run: |
          pnpm exec prettier --write apps/mobile
          if test -f .github/workflows/mobile-native-e2e.yml; then
            pnpm exec prettier --write .github/workflows/mobile-native-e2e.yml
            echo '=== FORMATTED NATIVE WORKFLOW START ==='
            cat .github/workflows/mobile-native-e2e.yml
            echo '=== FORMATTED NATIVE WORKFLOW END ==='
          fi

      - name: Commit formatting changes
        env:
          TARGET_BRANCH: ${{ matrix.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- apps/mobile; then
            git add apps/mobile
            HUSKY=0 git commit -m "style(mobile): [roadmap format] apply Prettier"
            HUSKY=0 git push origin HEAD:"$TARGET_BRANCH"
          fi

      - name: Typecheck mobile workspace
        run: pnpm --filter @gym/mobile typecheck

      - name: Run mobile unit and contracts tests
        run: pnpm --filter @gym/mobile test
