name: Publish verified release candidate to GHCR

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: 'Successful Release candidate images and signed provenance workflow run ID'
        required: true
        type: string
      source_sha:
        description: 'Full 40-character main commit SHA that the release run built'
        required: true
        type: string
      confirm_publish:
        description: 'Explicit authorization to publish both verified images'
        required: true
        default: NO_PUBLISH
        type: choice
        options:
          - NO_PUBLISH
          - PUBLISH_VERIFIED_CANDIDATE

# No PR, push, schedule or release trigger. No implicit registry permissions.
permissions:
  contents: read

# Serialize re-runs for the same release artifact; do not cancel mid-push.
concurrency:
  group: ghcr-publish-${{ inputs.release_run_id }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify provenance, publish and confirm GHCR digests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      checks: read
      attestations: write
      id-token: write
      artifact-metadata: write
      packages: write
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
      PUBLISH_CONFIRM: ${{ inputs.confirm_publish }}

    steps:
      - name: Checkout trusted promotion scripts from main
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Require explicit confirmation and verified source CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$PUBLISH_CONFIRM" = PUBLISH_VERIFIED_CANDIDATE || {
            echo "Explicit publication confirmation is required" >&2
            exit 1
          }
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          [[ "$RELEASE_RUN_ID" =~ ^[1-9][0-9]{0,15}$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID" > "$RUNNER_TEMP/release-run.json"
          node scripts/ghcr-promotion.mjs validate-run \
            --repository "$GITHUB_REPOSITORY" --source-sha "$SOURCE_SHA" \
            --release-run-id "$RELEASE_RUN_ID" \
            --run-json "$RUNNER_TEMP/release-run.json"
          # Exact-commit successful CI workflow is required before any registry push.
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SOURCE_SHA&branch=main&event=push&per_page=100" > "$RUNNER_TEMP/main-ci.json"
          node scripts/release-ci-gate.mjs "$RUNNER_TEMP/main-ci.json" "$GITHUB_REPOSITORY" "$SOURCE_SHA"

      - name: Download images and manifest from the verified release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release
          gh run download "$RELEASE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "gym-platform-api-release-$SOURCE_SHA-$RELEASE_RUN_ID" \
            --dir release

      - name: Verify archive hash, exact origin and both GitHub attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/release-bundle.mjs verify \
            --archive release/images.tar.gz --manifest release/manifest.json \
            --commit "$SOURCE_SHA" --repository "$GITHUB_REPOSITORY" \
            --run-id "$RELEASE_RUN_ID"
          for file in release/images.tar.gz release/manifest.json; do
            gh attestation verify "$file" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-artifacts.yml" \
              --source-ref refs/heads/main \
              --source-digest "$SOURCE_SHA"
          done

      - name: Load exact signed images and check config digests
        run: |
          set -euo pipefail
          docker load -i release/images.tar.gz
          node scripts/release-bundle.mjs verify-images \
            --manifest release/manifest.json --commit "$SOURCE_SHA" \
            --repository "$GITHUB_REPOSITORY" --run-id "$RELEASE_RUN_ID"

      # Generate inventories from the exact signed image archive, never source
      # directory or a mutable remote tag. The existing image-ID check is above.
      - name: Generate runtime SPDX SBOM from archived image
        uses: anchore/sbom-action@v0
        with:
          image: gym-platform-api:runtime-${{ inputs.source_sha }}
          format: spdx-json
          output-file: release/runtime.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate migration SPDX SBOM from archived image
        uses: anchore/sbom-action@v0
        with:
          image: gym-platform-api:migrate-${{ inputs.source_sha }}
          format: spdx-json
          output-file: release/migrate.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # A critical finding blocks image publication. Scanner or DB failures
      # are also fatal, rather than silently marked as zero vulnerabilities.
      - name: Scan runtime SBOM for critical vulnerabilities
        uses: anchore/scan-action@v7
        with:
          sbom: release/runtime.spdx.json
          fail-build: true
          severity-cutoff: critical
          output-format: json
          output-file: release/runtime.grype.json

      - name: Scan migration SBOM for critical vulnerabilities
        uses: anchore/scan-action@v7
        with:
          sbom: release/migrate.spdx.json
          fail-build: true
          severity-cutoff: critical
          output-format: json
          output-file: release/migrate.grype.json

      - name: Validate both security reports and summarize inventory
        run: |
          set -euo pipefail
          node scripts/release-supply-chain.mjs validate \
            release/runtime.spdx.json release/migrate.spdx.json \
            release/runtime.grype.json release/migrate.grype.json \
            | tee release/security-summary.json

      # Keep scanner evidence even when the critical-vulnerability gate fails.
      # Do not upload the large image archive, credentials or registry tokens.
      - name: Upload pre-publish SBOM and vulnerability evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ghcr-security-${{ inputs.source_sha }}-${{ inputs.release_run_id }}
          path: |
            release/runtime.spdx.json
            release/migrate.spdx.json
            release/runtime.grype.json
            release/migrate.grype.json
            release/security-summary.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Authenticate and refuse previously published tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          node scripts/ghcr-promotion.mjs preflight \
            --repository "$GITHUB_REPOSITORY" --source-sha "$SOURCE_SHA" \
            --release-run-id "$RELEASE_RUN_ID"

      - name: Publish both verified images without rebuilding
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A repeated promotion is blocked. GHCR tags themselves are mutable,
          # so consumers must pin the immutable digest printed by this job.
          node scripts/ghcr-promotion.mjs preflight \
            --repository "$GITHUB_REPOSITORY" --source-sha "$SOURCE_SHA" \
            --release-run-id "$RELEASE_RUN_ID" >/dev/null
          lower_repo="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          immutable_label="sha-$SOURCE_SHA-run-$RELEASE_RUN_ID"
          runtime="ghcr.io/$lower_repo:$immutable_label"
          migrate="ghcr.io/$lower_repo-migrate:$immutable_label"
          docker tag "gym-platform-api:runtime-$SOURCE_SHA" "$runtime"
          docker tag "gym-platform-api:migrate-$SOURCE_SHA" "$migrate"
          docker push "$runtime"
          docker push "$migrate"

          # Pull the published tags and verify their remote image IDs, labels
          # and non-root users against the attested release manifest.
          docker pull "$runtime"
          docker pull "$migrate"
          node scripts/ghcr-promotion.mjs verify-published \
            --repository "$GITHUB_REPOSITORY" --source-sha "$SOURCE_SHA" \
            --release-run-id "$RELEASE_RUN_ID" \
            --manifest release/manifest.json \
            > "$RUNNER_TEMP/ghcr-digests.json"
          cp "$RUNNER_TEMP/ghcr-digests.json" release/ghcr-digests.json
          node scripts/release-supply-chain.mjs digest-outputs             release/ghcr-digests.json "$GITHUB_REPOSITORY" "$GITHUB_OUTPUT"
          node -e '
            const fs = require("node:fs");
            const refs = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const lines = [
              "### Verified GHCR promotion",
              "Source SHA: " + process.env.SOURCE_SHA,
              "Release run: " + process.env.RELEASE_RUN_ID,
              "Runtime: " + refs.runtime,
              "Migrate: " + refs.migrate,
              "Deploy only by the exact @sha256 digest; no deploy occurred.",
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          ' "$RUNNER_TEMP/ghcr-digests.json"

      # The two SLSA attestations identify this *publishing* workflow as
      # signer, not the original image builder (whose signed archive was
      # independently verified above). Bind them to exact registry manifests.
      - name: Sign runtime OCI digest publication provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.published.outputs.runtime_name }}
          subject-digest: ${{ steps.published.outputs.runtime_digest }}
          push-to-registry: true

      - name: Sign migration OCI digest publication provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.published.outputs.migrate_name }}
          subject-digest: ${{ steps.published.outputs.migrate_digest }}
          push-to-registry: true

      - name: Sign runtime OCI SPDX SBOM attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.published.outputs.runtime_name }}
          subject-digest: ${{ steps.published.outputs.runtime_digest }}
          sbom-path: release/runtime.spdx.json
          push-to-registry: true

      - name: Sign migration OCI SPDX SBOM attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.published.outputs.migrate_name }}
          subject-digest: ${{ steps.published.outputs.migrate_digest }}
          sbom-path: release/migrate.spdx.json
          push-to-registry: true

      # Each exact OCI digest must have both signed SLSA (publish provenance)
      # and signed SPDX attestations from this trusted, manually run workflow.
      - name: Verify signed OCI provenance and both SBOM attestations
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_REF: ${{ steps.published.outputs.runtime_name }}@${{ steps.published.outputs.runtime_digest }}
          MIGRATE_REF: ${{ steps.published.outputs.migrate_name }}@${{ steps.published.outputs.migrate_digest }}
        run: |
          set -euo pipefail
          for ref in "$RUNTIME_REF" "$MIGRATE_REF"; do
            for predicate in https://slsa.dev/provenance/v1 https://spdx.dev/Document/v2.3; do
              gh attestation verify "oci://$ref" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-ghcr.yml" \
                --source-ref refs/heads/main \
                --source-digest "$GITHUB_SHA" \
                --predicate-type "$predicate"
            done
          done
          echo "Signed promotion provenance and SPDX SBOMs verified for both OCI digests." >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve digest-only publication receipt
        uses: actions/upload-artifact@v7
        with:
          name: ghcr-digests-${{ inputs.source_sha }}-${{ inputs.release_run_id }}
          path: release/ghcr-digests.json
          if-no-files-found: error
          retention-days: 30
