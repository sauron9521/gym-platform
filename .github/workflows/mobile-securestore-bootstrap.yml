name: Mobile SecureStore dependency bootstrap (temporary)
on:
  push:
    branches:
      - feat/mobile-securestore-refresh-session
permissions:
  contents: write
jobs:
  bootstrap:
    if: ${{ !contains(github.event.head_commit.message, '[securestore bootstrap]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install SDK-compatible native SecureStore
        run: pnpm --filter @gym/mobile add 'expo-secure-store@~58.0.3'
      - name: Commit lockfile and mobile dependency
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/package.json pnpm-lock.yaml
          HUSKY=0 git commit -m 'chore(mobile): [securestore bootstrap] install Expo SecureStore 58'
          HUSKY=0 git push origin HEAD:feat/mobile-securestore-refresh-session
