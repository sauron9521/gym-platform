rule_files:
  - backup-health.rules.yml
evaluation_interval: 1m

tests:
  - name: "failed backup check fires after five minutes"
    interval: 1m
    input_series:
      - series: gym_api_backup_verified
        values: "0+0x15"
      - series: gym_api_backup_last_check_timestamp_seconds
        values: "0+60x15"
    alert_rule_test:
      - eval_time: 4m
        alertname: GymApiBackupVerificationFailed
        exp_alerts: []
      - eval_time: 7m
        alertname: GymApiBackupVerificationFailed
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: "Latest gym API backup is missing, stale or failed verification"

  - name: "healthy verified backups stay silent"
    interval: 1m
    input_series:
      - series: gym_api_backup_verified
        values: "1+0x15"
      - series: gym_api_backup_last_check_timestamp_seconds
        values: "0+60x15"
    alert_rule_test:
      - eval_time: 12m
        alertname: GymApiBackupVerificationFailed
        exp_alerts: []
      - eval_time: 12m
        alertname: GymApiBackupHealthSnapshotStale
        exp_alerts: []
      - eval_time: 12m
        alertname: GymApiBackupHealthSnapshotMissing
        exp_alerts: []

  - name: "missing collector produces distinct missing alert"
    interval: 1m
    alert_rule_test:
      - eval_time: 29m
        alertname: GymApiBackupHealthSnapshotMissing
        exp_alerts: []
      - eval_time: 32m
        alertname: GymApiBackupHealthSnapshotMissing
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: "Gym API backup health collector has no metrics"

  - name: "stale collector alert is not suppressed by last healthy result"
    interval: 1m
    input_series:
      - series: gym_api_backup_verified
        values: "1+0x60"
      - series: gym_api_backup_last_check_timestamp_seconds
        values: "0+0x60"
    alert_rule_test:
      - eval_time: 34m
        alertname: GymApiBackupHealthSnapshotStale
        exp_alerts: []
      - eval_time: 38m
        alertname: GymApiBackupHealthSnapshotStale
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: "Gym API backup health collector has not updated for 30 minutes"
