groups:
  - name: gym-api-operator-monitoring
    interval: 30s
    rules:
      - alert: GymApiMonitoringSnapshotMissing
        expr: absent(gym_api_monitor_last_run_timestamp_seconds)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Gym API monitoring snapshot is missing"

      - alert: GymApiMonitoringSnapshotStale
        expr: time() - gym_api_monitor_last_run_timestamp_seconds > 900
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Gym API monitoring snapshot has not updated for 15 minutes"

      - alert: GymApiLivenessFailed
        expr: gym_api_monitor_live_probe_success == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Gym API liveness probe failed"

      - alert: GymApiReadinessFailed
        expr: gym_api_monitor_ready_probe_success == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Gym API readiness probe failed"

      - alert: GymApiHealthProbeNotConfigured
        expr: gym_api_monitor_ready_probe_success == -1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Gym API active readiness check is not configured"

      - alert: GymApiHttp503Elevated
        expr: |
          (gym_api_monitor_http_503_window_5m
            / clamp_min(gym_api_monitor_http_requests_window_5m, 1)) >= 0.05
          and gym_api_monitor_http_requests_window_5m >= 20
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Gym API HTTP 503 share exceeds 5 percent"

      - alert: GymApiHttp429Elevated
        expr: |
          (gym_api_monitor_http_429_window_5m
            / clamp_min(gym_api_monitor_http_requests_window_5m, 1)) >= 0.20
          and gym_api_monitor_http_requests_window_5m >= 20
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Gym API HTTP 429 share exceeds 20 percent"

      - alert: GymApiRedisOutageObserved
        expr: gym_api_monitor_redis_outages_window_5m > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Gym API observed a Redis outage in the last report window"

      - alert: GymApiMonitoringTextfileReadError
        expr: node_textfile_scrape_error == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Node exporter cannot read one or more textfile snapshots"

      - alert: GymApiMonitoringCriticalSignal
        expr: gym_api_monitor_critical_alert == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Gym API monitoring report contains a critical signal"

      - alert: GymApiMonitoringWarningSignal
        expr: gym_api_monitor_warning_alert == 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Gym API monitoring report contains a warning signal"

      # Metrics are produced by a separate opt-in trusted host collector.
      - alert: GymApiDockerResourceSnapshotMissing
        expr: absent(gym_api_docker_last_sample_timestamp_seconds)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Gym API Docker resource sampler has no metrics"

      - alert: GymApiDockerResourceSnapshotStale
        expr: time() - gym_api_docker_last_sample_timestamp_seconds > 180
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Gym API Docker resource metrics are stale"

      - alert: GymApiDockerContainerStopped
        expr: gym_api_docker_running == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Gym API Docker container is not running"

      - alert: GymApiDockerOOMKilled
        expr: gym_api_docker_oom_killed == 1
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Gym API Docker container was killed by OOM"

      - alert: GymApiDockerMemoryPressure
        expr: gym_api_docker_memory_percent >= 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Gym API container memory usage exceeds 90 percent"

      - alert: GymApiDockerCpuSaturation
        expr: gym_api_docker_cpu_percent >= 180
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Gym API container CPU usage is near its 2-core limit"

      - alert: GymApiDockerPidPressure
        expr: gym_api_docker_pids >= 230
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Gym API container PID usage is near its 256-PID limit"

      # RestartCount is a per-container gauge; the number resets on recreate.
      - alert: GymApiDockerRestartLoop
        expr: clamp_min(delta(gym_api_docker_restart_count[10m]), 0) >= 3
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Gym API container restarted at least three times within ten minutes"

      # Opt-in trusted host collector. Deploy together with the signals timer.
      - alert: GymApiDockerSignalsSnapshotMissing
        expr: absent(gym_api_docker_signals_last_sample_timestamp_seconds)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Gym API Docker events and cgroup sampler has no metrics"

      - alert: GymApiDockerSignalsSnapshotStale
        expr: time() - gym_api_docker_signals_last_sample_timestamp_seconds > 180
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Gym API Docker events and cgroup metrics are stale"

      - alert: GymApiDockerRecentOomEvents
        expr: gym_api_docker_oom_events_window_10m > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Docker reported an API container OOM event in the last ten minutes"

      - alert: GymApiDockerCpuThrottling
        expr: |
          (
            increase(gym_api_docker_cpu_throttled_periods_total[5m])
            / clamp_min(increase(gym_api_docker_cpu_periods_total[5m]), 1)
          ) >= 0.20
          and gym_api_docker_signals_running == 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Gym API CPU cgroup is throttled in at least 20 percent of periods"
