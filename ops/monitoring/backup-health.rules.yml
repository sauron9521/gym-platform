# Opt-in backup rules. Load ONLY after deploying the backup health collector.
# node_exporter/Prometheus availability requires independent monitoring.
groups:
  - name: gym-platform-api-backup-readiness
    interval: 1m
    rules:
      - alert: GymApiBackupVerificationFailed
        expr: gym_api_backup_verified == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Latest gym API backup is missing, stale or failed verification'

      - alert: GymApiBackupHealthSnapshotMissing
        expr: absent(gym_api_backup_last_check_timestamp_seconds)
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: 'Gym API backup health collector has no metrics'

      - alert: GymApiBackupHealthSnapshotStale
        expr: time() - gym_api_backup_last_check_timestamp_seconds > 1800
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Gym API backup health collector has not updated for 30 minutes'
